name: X Manager

on:
  schedule:
    # UTC+7: 04:00, 08:00, 12:00, 16:00, 20:00.
    # 04:00 local is 21:00 UTC on the previous calendar day.
    - cron: '0 21 * * *'
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reads X; live can publish replies; check verifies the account; status reads saved state'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
          - check
          - status

permissions: {}

concurrency:
  group: x-manager-state
  cancel-in-progress: false

jobs:
  manage:
    # An unset/false enable variable prevents scheduled jobs from starting.
    # Manual read-only modes remain available before live automation is enabled.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' || vars.X_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      STATE_BACKEND: github
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_EXPECTED_USERNAME: ${{ vars.X_EXPECTED_USERNAME }}
      X_AUTOMATION_ENABLED: ${{ vars.X_AUTOMATION_ENABLED || 'false' }}
      ENABLE_EMAIL_ALERTS: ${{ vars.ENABLE_EMAIL_ALERTS || 'false' }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      MANAGER_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'dry-run' }}
    steps:
      - name: Check configuration before any X request
        shell: bash
        run: |
          set -euo pipefail
          case "$MANAGER_MODE" in
            dry-run|live|check|status) ;;
            *) echo '::error::Unknown manager mode.'; exit 1 ;;
          esac
          if [[ "$MANAGER_MODE" == 'live' && "$X_AUTOMATION_ENABLED" != 'true' ]]; then
            echo '::error::Live mode is disabled. Set repository variable X_AUTOMATION_ENABLED=true when ready.'
            exit 1
          fi
          if [[ "$MANAGER_MODE" != 'status' ]]; then
            for required in X_API_KEY X_API_KEY_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET X_EXPECTED_USERNAME; do
              if [[ -z "${!required}" ]]; then
                echo "::error::Missing configuration: $required. See docs/SETUP.md."
                exit 1
              fi
            done
          fi
          if [[ "$MANAGER_MODE" == 'live' && "$ENABLE_EMAIL_ALERTS" == 'true' ]]; then
            for required in GMAIL_ADDRESS GMAIL_APP_PASSWORD NOTIFICATION_EMAIL; do
              if [[ -z "${!required}" ]]; then
                echo "::error::Email alerts are enabled but $required is missing."
                exit 1
              fi
            done
          fi

      - name: Check out the selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the selected manager mode
        shell: bash
        run: |
          set -euo pipefail
          case "$MANAGER_MODE" in
            check|status) python x_auto_engage.py "$MANAGER_MODE" ;;
            dry-run|live) python x_auto_engage.py run --mode "$MANAGER_MODE" ;;
          esac
